name: native_feed_player
description: >-
  Native video playback for scrollable Flutter feeds, with direction-aware
  prebuffering, disk caching, player pooling, and playback quality metrics.
version: 0.1.0
homepage: https://github.com/aswinsubhash/native_feed_player
repository: https://github.com/aswinsubhash/native_feed_player
issue_tracker: https://github.com/aswinsubhash/native_feed_player/issues

topics:
  - video
  - video-player
  - feed
  - caching
  - media

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned for reproducible generated bindings.
  pigeon: 26.1.7

flutter:
  plugin:
    platforms:
      android:
        package: io.github.aswinsubhash.native_feed_player
        pluginClass: NativeFeedPlayerPlugin
      ios:
        pluginClass: NativeFeedPlayerPlugin
