name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Flutter release cannot turn CI red without a commit here.
  FLUTTER_VERSION: 3.44.1

jobs:
  dart:
    name: Analyze and test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib test example/lib example/test example/integration_test \
            pigeons tool

      - name: Analyze
        run: flutter analyze

      - name: Package tests
        run: flutter test --coverage

      - name: Example tests
        working-directory: example
        run: flutter test

      - name: Verify Pigeon output is up to date
        # A stale generated file is a silent source of platform drift, so the
        # generator is re-run and the tree must come back unchanged.
        run: |
          dart run pigeon \
            --input pigeons/native_feed_player_messages.dart \
            --dart_out lib/src/messages.g.dart \
            --kotlin_out android/src/main/kotlin/io/github/aswinsubhash/native_feed_player/Messages.g.kt \
            --kotlin_package io.github.aswinsubhash.native_feed_player \
            --swift_out ios/Classes/Messages.g.swift
          dart format lib/src/messages.g.dart
          git diff --exit-code -- \
            lib/src/messages.g.dart \
            android/src/main/kotlin/io/github/aswinsubhash/native_feed_player/Messages.g.kt \
            ios/Classes/Messages.g.swift

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  android:
    name: Build and test (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Plugin unit tests
        working-directory: example/android
        run: ./gradlew :native_feed_player:testDebugUnitTest

      - name: Debug APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build and test (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Simulator build
        working-directory: example
        run: flutter build ios --simulator --no-codesign

      - name: Plugin unit tests
        working-directory: example/ios
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j | ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
              phone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
              puts phone["udid"] if phone
            '
          )"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Catches packaging problems (missing metadata, stray files) long before
      # an actual release is attempted.
      - run: flutter pub publish --dry-run
