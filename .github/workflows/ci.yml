name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  FLUTTER_MIN_VERSION: 3.47.0

jobs:
  dart:
    name: Analyze and test (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Restore analysis options after Flutter migration
        run: git checkout -- analysis_options.yaml example/analysis_options.yaml

      - name: Verify formatting
        run: |
          dart format --output=none \
            lib test example/lib example/test example/integration_test \
            pigeons tool

      - name: Analyze
        run: flutter analyze

      - name: Package tests
        run: flutter test --coverage

      - name: Example tests
        working-directory: example
        run: flutter test

      - name: Verify example lockfile is up to date
        run: git diff --exit-code -- example/pubspec.lock

      - name: Generate documentation
        run: dart doc

      - name: Verify Pigeon output is up to date
        run: |
          dart run tool/generate_pigeon.dart
          git diff --exit-code -- \
            lib/src/messages.g.dart \
            android/src/main/kotlin/io/github/aswinsubhash/native_feed_player/Messages.g.kt \
            ios/native_feed_player/Sources/native_feed_player/Messages.g.swift

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  minimum-flutter:
    name: Test minimum Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_MIN_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Restore analysis options after Flutter migration
        run: git checkout -- analysis_options.yaml example/analysis_options.yaml
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build and test (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Plugin unit tests
        working-directory: example/android
        run: ./gradlew :native_feed_player:testDebugUnitTest

      - name: Plugin lint
        working-directory: example/android
        run: ./gradlew :native_feed_player:lintDebug

      - name: Debug APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build and test (iOS, ${{ matrix.package-manager }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [cocoapods, swiftpm]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure package manager
        run: |
          if [ "${{ matrix.package-manager }}" = "swiftpm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi

      - run: flutter pub get

      - name: Strict CocoaPods validation
        if: matrix.package-manager == 'cocoapods'
        run: |
          pod lib lint ios/native_feed_player.podspec \
            --configuration=Debug --skip-tests --use-modular-headers --use-libraries
          pod lib lint ios/native_feed_player.podspec \
            --configuration=Debug --skip-tests --use-modular-headers

      - name: Simulator build
        working-directory: example
        run: flutter build ios --simulator --no-codesign

      - name: Plugin unit tests
        working-directory: example/ios
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j | ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
              phone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
              puts phone["udid"] if phone
            '
          )"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO

  android-integration:
    name: Integration tests (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Restore analysis options after Flutter migration
        run: git checkout -- analysis_options.yaml example/analysis_options.yaml

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            cd example
            flutter pub get
            flutter test --no-pub integration_test/plugin_integration_test.dart -d "$(adb get-serialno)"

  ios-integration:
    name: Integration tests (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Restore analysis options after Flutter migration
        run: git checkout -- analysis_options.yaml example/analysis_options.yaml

      - name: Boot simulator
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j | ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
              phone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
              puts phone["udid"] if phone
            '
          )"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: example
        run: flutter pub get && flutter test --no-pub integration_test/plugin_integration_test.dart -d "$SIMULATOR_ID"

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Restore analysis options after Flutter migration
        run: git checkout -- analysis_options.yaml example/analysis_options.yaml

      - run: flutter pub publish --dry-run
